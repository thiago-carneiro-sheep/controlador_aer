<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controlador · Aero Rancho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#16211f;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dcd6c8;
    --muted:#6b6f68;
    --pine:#1f4d43;
    --pine-light:#2f6c5d;

    --risco-azul:#3b76c9;      --risco-azul-bg:#e9f0fb;
    --risco-verde:#3f8f52;     --risco-verde-bg:#eaf6ec;
    --risco-amarelo:#a6790c;   --risco-amarelo-bg:#fbf1d9;
    --risco-laranja:#c1590f;   --risco-laranja-bg:#fcece0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:28px 18px 64px;
  }
  .wrap{max-width:1240px;margin:0 auto;}

  /* ---- header ---- */
  header.app-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--pine); font-weight:600; margin:0 0 6px;
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:27px; margin:0; letter-spacing:-.01em;}

  .head-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .action-btn{
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
    padding:9px 16px; border-radius:7px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink);
  }
  .action-btn:hover{ border-color:var(--pine); color:var(--pine); background:#f2f6f4; }
  .action-btn.danger{ color:#b3261e; border-color:#f0cfc9; }
  .action-btn.danger:hover{ border-color:#b3261e; background:#fbe9e7; }

  .meta-bar{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 20px;
    margin-bottom:24px;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:16px;
  }
  @media (max-width:700px){ .meta-bar{grid-template-columns:1fr;} }

  label{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); display:block; margin-bottom:6px;
  }
  input[type=text], input[type=date]{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    font-family:inherit; font-size:14px; background:#fff; color:var(--ink);
  }
  input[type=text]:focus, input[type=date]:focus{
    outline:none; border-color:var(--pine); box-shadow:0 0 0 3px rgba(31,77,67,.12);
  }

  .period-options{ display:flex; gap:6px; }
  .period-chip{ position:relative; flex:1; }
  .period-chip input{ position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; left:0; top:0; }
  .period-chip span{
    display:flex; align-items:center; justify-content:center;
    padding:9px 6px; border-radius:7px; border:1.5px solid var(--line);
    font-size:12.5px; font-weight:600; cursor:pointer; background:#fff; color:var(--muted);
  }
  .period-chip input:checked ~ span{ border-color:var(--pine); background:#eaf1ee; color:var(--pine); }

  /* ---- rooms grid ---- */
  .rooms-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
    margin-bottom:26px;
  }
  @media (max-width:900px){ .rooms-grid{grid-template-columns:1fr;} }

  .room-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .room-head{
    padding:14px 18px;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .room-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px; margin:0; letter-spacing:.01em;
  }
  .doctor-field{ flex:1; min-width:180px; max-width:280px; }
  .doctor-field label{ color:#cfd6d0; margin-bottom:4px; font-size:10px; }
  .doctor-field input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    color:#fff;
    font-size:13px;
    padding:7px 10px;
  }
  .doctor-field input::placeholder{ color:#98a29c; }
  .doctor-field input:focus{ outline:none; border-color:#fff; box-shadow:none; background:rgba(255,255,255,.14); }

  .room-body{ padding:14px 18px 16px; flex:1; display:flex; flex-direction:column; }

  table.grid-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.grid-table thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); font-weight:600; padding:6px 6px; border-bottom:1px solid var(--line);
  }
  table.grid-table thead th.num-col{ width:28px; }
  table.grid-table thead th.risk-col{ width:190px; }
  table.grid-table thead th.del-col{ width:28px; }
  table.grid-table tbody td{ padding:6px 6px; border-bottom:1px solid #ede9db; vertical-align:middle; }
  table.grid-table tbody tr:last-child td{ border-bottom:none; }
  table.grid-table tbody td.idx{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; }

  .patient-input{
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    font-family:inherit; font-size:13px; background:#fff; color:var(--ink);
  }
  .patient-input:focus{ outline:none; border-color:var(--pine); box-shadow:0 0 0 2px rgba(31,77,67,.1); }

  .risk-mini-options{ display:flex; gap:4px; flex-wrap:nowrap; }
  .risk-mini{ position:relative; }
  .risk-mini input{ position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; left:0; top:0; }
  .risk-mini span{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:26px; border-radius:6px; border:1.5px solid var(--line);
    cursor:pointer; font-size:0;
  }
  .risk-mini span::after{ content:""; width:8px; height:8px; border-radius:50%; display:block; }
  .risk-mini[data-r="Azul"] span::after{ background:var(--risco-azul); opacity:.35; }
  .risk-mini[data-r="Verde"] span::after{ background:var(--risco-verde); opacity:.35; }
  .risk-mini[data-r="Amarelo"] span::after{ background:var(--risco-amarelo); opacity:.35; }
  .risk-mini[data-r="Laranja"] span::after{ background:var(--risco-laranja); opacity:.35; }
  .risk-mini[data-r="Azul"] input:checked ~ span{ border-color:var(--risco-azul); background:var(--risco-azul-bg); }
  .risk-mini[data-r="Azul"] input:checked ~ span::after{ opacity:1; }
  .risk-mini[data-r="Verde"] input:checked ~ span{ border-color:var(--risco-verde); background:var(--risco-verde-bg); }
  .risk-mini[data-r="Verde"] input:checked ~ span::after{ opacity:1; }
  .risk-mini[data-r="Amarelo"] input:checked ~ span{ border-color:var(--risco-amarelo); background:var(--risco-amarelo-bg); }
  .risk-mini[data-r="Amarelo"] input:checked ~ span::after{ opacity:1; }
  .risk-mini[data-r="Laranja"] input:checked ~ span{ border-color:var(--risco-laranja); background:var(--risco-laranja-bg); }
  .risk-mini[data-r="Laranja"] input:checked ~ span::after{ opacity:1; }

  .risk-print-label{ display:none; }

  .del-row-btn{
    border:none; background:none; color:var(--muted); cursor:pointer;
    font-size:15px; line-height:1; padding:4px; border-radius:5px;
  }
  .del-row-btn:hover{ color:#b3261e; background:#fbe9e7; }

  .add-patient-btn{
    margin-top:10px;
    align-self:flex-start;
    background:none;
    border:1.5px dashed var(--line);
    color:var(--pine);
    font-family:inherit;
    font-weight:600;
    font-size:12.5px;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .add-patient-btn:hover{ border-color:var(--pine); background:#f2f6f4; }

  .room-empty{
    padding:18px 6px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  .room-foot{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .mini-total{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; font-weight:600; color:var(--muted);
    padding:4px 9px; border-radius:20px; background:#faf9f4;
    font-variant-numeric:tabular-nums;
  }
  .mini-total .dot{ width:7px; height:7px; border-radius:50%; }
  .mini-total.Azul .dot{ background:var(--risco-azul); } .mini-total.Azul{ color:var(--risco-azul); background:var(--risco-azul-bg); }
  .mini-total.Verde .dot{ background:var(--risco-verde); } .mini-total.Verde{ color:var(--risco-verde); background:var(--risco-verde-bg); }
  .mini-total.Amarelo .dot{ background:var(--risco-amarelo); } .mini-total.Amarelo{ color:var(--risco-amarelo); background:var(--risco-amarelo-bg); }
  .mini-total.Laranja .dot{ background:var(--risco-laranja); } .mini-total.Laranja{ color:var(--risco-laranja); background:var(--risco-laranja-bg); }
  .mini-total.geral{ color:var(--ink); background:#eee9d8; margin-left:auto; }

  /* ---- summary ---- */
  .panel-flat{ background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .totals-head{ padding:18px 22px 4px; }
  .totals-head h2{ font-family:'Space Grotesk',sans-serif; font-size:15px; margin:0 0 3px; }
  .totals-head p{ margin:0 0 14px; font-size:12.5px; color:var(--muted); }

  table.pivot{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.pivot thead th{
    background:var(--ink); color:var(--paper); text-align:left; font-size:11px;
    text-transform:uppercase; letter-spacing:.05em; font-weight:600; padding:10px 22px;
  }
  table.pivot thead th.risk-col-Azul{ color:#bcd7ff; }
  table.pivot thead th.risk-col-Verde{ color:#c4ecc9; }
  table.pivot thead th.risk-col-Amarelo{ color:#f3dfa3; }
  table.pivot thead th.risk-col-Laranja{ color:#f6cba9; }
  table.pivot tbody td{ padding:10px 22px; border-bottom:1px solid #ede9db; }
  table.pivot tbody tr:last-child td{ border-bottom:none; }
  table.pivot tbody td.num{ font-variant-numeric:tabular-nums; font-weight:600; text-align:center; }
  table.pivot tbody td.room-name{ font-weight:600; }
  table.pivot tbody td.doctor-sub{ display:block; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:2px; }
  table.pivot tbody td.total-col{ background:#f0efe6; font-weight:700; text-align:center; }
  table.pivot tfoot td{
    padding:12px 22px; font-weight:700; border-top:2px solid var(--ink);
    background:#faf9f4; font-variant-numeric:tabular-nums;
  }
  table.pivot tfoot td.total-col{ background:#e6e4d8; text-align:center; }
  table.pivot tfoot td.num{ text-align:center; }

  footer.note{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:20px; }

  /* ---- print ---- */
  @media print{
    @page{ size: landscape; margin: 6mm; }

    html,body{ width:100%; height:100%; }
    body{ background:#fff; padding:0; font-size:9px; color:#111; }
    .wrap{ max-width:none; }

    .head-actions, .add-patient-btn, .del-row-btn, footer.note{ display:none !important; }

    header.app-head{ padding-bottom:4px; margin-bottom:5px; border-bottom-width:1px; }
    h1{ font-size:14px; }
    .eyebrow{ font-size:7.5px; margin-bottom:1px; }

    .meta-bar{ padding:4px 8px; margin-bottom:5px; gap:6px; grid-template-columns:1.4fr 1fr 1fr; border-color:#999; }
    .meta-bar label{ font-size:7px; margin-bottom:1px; }
    .meta-bar input, .period-chip span{ padding:2px 5px; font-size:9px; border-color:#999; }

    .rooms-grid{ grid-template-columns:repeat(5, 1fr); gap:4px; margin-bottom:5px; }
    .room-card{ break-inside:avoid; border-color:#999; }
    .room-head{
      background:#eee !important; color:#111 !important; padding:3px 5px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; flex-direction:column; align-items:flex-start; gap:2px;
    }
    .room-head h2{ font-size:9px; }
    .doctor-field{ max-width:none; width:100%; }
    .doctor-field label{ font-size:6.5px; margin-bottom:1px; }
    .doctor-field input{ background:#fff !important; border-color:#999 !important; color:#111 !important; font-size:8px; padding:1px 4px; }

    .room-body{ padding:3px 4px 5px; }

    table.grid-table{ font-size:7.5px; table-layout:fixed; width:100%; }
    table.grid-table thead th{ padding:1px 2px; font-size:6.5px; }
    table.grid-table thead th.num-col{ width:12px; }
    table.grid-table thead th.risk-col{ width:auto; }
    table.grid-table thead th.del-col{ display:none; }
    table.grid-table tbody td{ padding:0.5px 2px; line-height:1.35; border-bottom-color:#e2ded0; }
    table.grid-table tbody td:last-child{ display:none; }

    .patient-input{
      border:none !important; background:transparent !important; padding:0 !important;
      font-size:7.5px; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      display:block; width:100%;
    }
    .risk-mini-options{ display:none !important; }
    .risk-print-label{
      display:inline-block; font-size:7px; font-weight:700; letter-spacing:.01em;
      white-space:nowrap;
    }

    .room-foot{ margin-top:4px; padding-top:4px; gap:2px; border-color:#ccc; }
    .mini-total{ font-size:6.5px; padding:1px 5px; background:none !important; border:1px solid #ccc; }
    .mini-total .dot{ width:5px; height:5px; }
    .mini-total.geral{ background:#eee !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    .panel-flat, .meta-bar{ break-inside:avoid; }
    .totals-head{ padding:5px 10px 1px; }
    .totals-head h2{ font-size:10px; margin-bottom:1px; }
    .totals-head p{ display:none; }
    table.pivot{ font-size:8.5px; }
    table.pivot thead th{
      background:#eee !important; color:#111 !important; padding:3px 10px; font-size:7px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact;
    }
    table.pivot tbody td, table.pivot tfoot td{ padding:3px 10px; }
    table.pivot tbody td.doctor-sub{ font-size:6.5px; }

    a[href]:after{ content:""; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app-head">
    <div>
      <p class="eyebrow">CRS · Aero Rancho</p>
      <h1>Controlador de Atendimento</h1>
    </div>
    <div class="head-actions">
      <button class="action-btn" id="printBtn" type="button">Imprimir</button>
      <button class="action-btn danger" id="clearBtn" type="button">Limpar tudo</button>
      <div id="saveHint" style="font-size:12px;color:var(--muted);">Carregando dados salvos…</div>
    </div>
  </header>

  <section class="meta-bar">
    <div>
      <label for="controladorInput">Controlador</label>
      <input type="text" id="controladorInput" list="controladorList" placeholder="Nome de quem está controlando" autocomplete="off">
    </div>
    <div>
      <label>Período</label>
      <div class="period-options">
        <label class="period-chip"><input type="radio" name="periodo" value="Matutino"><span>Matutino</span></label>
        <label class="period-chip"><input type="radio" name="periodo" value="Vespertino"><span>Vespertino</span></label>
        <label class="period-chip"><input type="radio" name="periodo" value="Noturno"><span>Noturno</span></label>
      </div>
    </div>
    <div>
      <label for="dataInput">Data</label>
      <input type="date" id="dataInput">
    </div>
  </section>

  <div class="rooms-grid" id="roomsGrid"></div>

  <section class="panel-flat">
    <div class="totals-head">
      <h2>Totalização geral</h2>
      <p>Atendimentos por consultório e classificação de risco, com total geral do período.</p>
    </div>
    <div id="pivotHost"></div>
  </section>

  <footer class="note">Os dados ficam salvos automaticamente neste navegador. <span id="versionTag">· v1.000</span></footer>
</div>

<datalist id="doctorList"></datalist>
<datalist id="controladorList"></datalist>

  const CONTROLLERS = ["ADRIANO SOUZA","ADRIELE CRISANTO","ALESSANDRO GONCALVES","ALEXFRANCIS DIAS","ANA CAROLINA DA SILVA","ANA PAULA","ANDRE FELIPE","ANGELA FORTUNATO","ANGELA M. TEIXEIRA","BRUNIELEN DOS SANTOS","CLODOALDO ATAIDE","DARIENE BERTOLDO","DAYANE CRISTINA","EDUARDO OLIVEIRA LOPES","ELISANDRO SANTOS","EMERSON CABANHAS","EMILEIDE LUCINEIA","ERYK GARCIA","FATIMA BARBOSA","FLAVIA OGEDA","GABRIELE SANTOS","IDALINA DIAS","JEFFERSON LUIZ","JOAO PEDRO","JOSE ROBERTO","JULIANA ALVES","LEANDRO GONÇALVES DA SILVA","LUCAS GOMES","LUCIANA LIMA","LUCIANA VIEGAS","LUIS GUSTAVO DE ARRUDA LIMA","MARCOS RODRIGUES","MARYANNE CARDOSO","MÉRLIN GARCIA","NEILZA COSTA","RAPHAEL GOUVEIA","RHAYLLA SANCHES","RODRIGO RIBEIRO","SILGMAR DIAS","SIMONE BEZERRA","THIAGO CARNEIRO DE OLIVEIRA","VANESKA LEITE","VANESSA OLIVEIRA"];

  const doctorList = document.getElementById('doctorList');
  doctorList.innerHTML = DOCTORS.map(d => `<option value="${d}"></option>`).join('');

  const controladorList = document.getElementById('controladorList');
  controladorList.innerHTML = CONTROLLERS.map(c => `<option value="${c}"></option>`).join('');

  const roomsGrid = document.getElementById('roomsGrid');
  const pivotHost = document.getElementById('pivotHost');
  const controladorInput = document.getElementById('controladorInput');
  const dataInput = document.getElementById('dataInput');
  const saveHint = document.getElementById('saveHint');

  let state = {
    controlador: "",
    periodo: "",
    data: "",
    rooms: Array.from({length: ROOM_COUNT}, (_, i) => ({
      name: "Consultório " + String(i+1).padStart(2,'0'),
      doctor: "",
      patients: []
    }))
  };

  let saveTimer = null;

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }
  function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

  // Storage layer, in priority order:
  // 1) Supabase (real database, syncs across any computer) — used when
  //    SUPABASE_URL/SUPABASE_ANON_KEY above are filled in.
  // 2) Claude's persistent storage — used automatically when this runs as
  //    an artifact inside the chat and Supabase isn't configured.
  // 3) The browser's own localStorage — last resort, only saves on this
  //    one browser/computer.
  const isSupabaseConfigured = SUPABASE_URL.startsWith('https://') && SUPABASE_ANON_KEY.length > 20;
  const supabaseClient = (isSupabaseConfigured && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  const hasCloudStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.get === 'function';

  let lastKnownUpdatedAt = null; // used to detect changes made from other computers

  async function storageGet(key){
    if(supabaseClient){
      const { data, error } = await supabaseClient
        .from('board').select('state, updated_at').eq('id', key).maybeSingle();
      if(error) throw error;
      if(!data) return null;
      lastKnownUpdatedAt = data.updated_at;
      return JSON.stringify(data.state);
    }
    if(hasCloudStorage){
      try{
        const res = await window.storage.get(key, false);
        return res ? res.value : null;
      }catch(e){
        return null;
      }
    }
    try{
      return window.localStorage.getItem(key);
    }catch(e){
      return null;
    }
  }

  async function storageSet(key, value){
    if(supabaseClient){
      const nowIso = new Date().toISOString();
      const { error } = await supabaseClient
        .from('board')
        .upsert({ id: key, state: JSON.parse(value), updated_at: nowIso });
      if(error) throw error;
      lastKnownUpdatedAt = nowIso;
      return;
    }
    if(hasCloudStorage){
      const res = await window.storage.set(key, value, false);
      if(!res) throw new Error('storage.set returned no result');
      return;
    }
    window.localStorage.setItem(key, value);
  }

  function storageModeLabel(){
    if(supabaseClient) return "Supabase (sincronizado entre computadores)";
    if(hasCloudStorage) return "memória do Claude";
    return "este navegador";
  }

  // Polls Supabase for changes made from other computers and refreshes the
  // screen automatically, without interrupting whatever the person is
  // currently typing.
  function startSyncPolling(){
    if(!supabaseClient) return;
    setInterval(async () => {
      const active = document.activeElement;
      const isTyping = active && (active.tagName === 'INPUT');
      if(isTyping) return; // don't yank the board while someone is mid-keystroke

      try{
        const { data, error } = await supabaseClient
          .from('board').select('state, updated_at').eq('id', STORAGE_KEY).maybeSingle();
        if(error || !data) return;
        if(data.updated_at !== lastKnownUpdatedAt){
          lastKnownUpdatedAt = data.updated_at;
          state = data.state;
          controladorInput.value = state.controlador || "";
          dataInput.value = state.data || "";
          document.querySelectorAll('input[name="periodo"]').forEach(r => { r.checked = (r.value === state.periodo); });
          renderRooms();
          renderPivot();
          saveHint.textContent = "Atualizado por outro computador.";
        }
      }catch(e){ /* silent — try again next tick */ }
    }, SYNC_POLL_MS);
  }

  async function loadState(){
    try{
      const raw = await storageGet(STORAGE_KEY);
      if(raw){
        const loaded = JSON.parse(raw);
        if(loaded && Array.isArray(loaded.rooms) && loaded.rooms.length === ROOM_COUNT){
          state = loaded;
        }
      }
    }catch(e){ /* nothing saved yet, or storage unavailable */ }

    if(!state.data){
      const now = new Date();
      state.data = now.toISOString().slice(0,10);
    }

    controladorInput.value = state.controlador || "";
    dataInput.value = state.data || "";
    if(state.periodo){
      const r = document.querySelector(`input[name="periodo"][value="${state.periodo}"]`);
      if(r) r.checked = true;
    }

    renderRooms();
    renderPivot();
    saveHint.textContent = "Salvo automaticamente · " + storageModeLabel() + ".";
    startSyncPolling();
  }

  function queueSave(){
    saveHint.textContent = "Salvando…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 250);
  }

  async function doSave(){
    clearTimeout(saveTimer);
    try{
      await storageSet(STORAGE_KEY, JSON.stringify(state));
      saveHint.textContent = "Tudo salvo.";
    }catch(e){
      saveHint.textContent = "Não foi possível salvar agora.";
    }
  }

  // Save immediately (no debounce) whenever a field loses focus, the tab is
  // hidden, or the page is about to close — so nothing typed gets lost.
  document.addEventListener('focusout', doSave);
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) doSave();
  });
  window.addEventListener('pagehide', doSave);
  window.addEventListener('beforeunload', doSave);

  controladorInput.addEventListener('input', () => {
    state.controlador = controladorInput.value;
    queueSave();
  });
  dataInput.addEventListener('change', () => {
    state.data = dataInput.value;
    queueSave();
  });
  document.querySelectorAll('input[name="periodo"]').forEach(r => {
    r.addEventListener('change', () => {
      state.periodo = r.value;
      queueSave();
    });
  });

  document.getElementById('printBtn').addEventListener('click', () => {
    window.print();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if(!confirm("Isso vai apagar o controlador, período, data e todos os pacientes lançados nas 5 salas. Deseja continuar?")) return;

    state = {
      controlador: "",
      periodo: "",
      data: new Date().toISOString().slice(0,10),
      rooms: Array.from({length: ROOM_COUNT}, (_, i) => ({
        name: "Consultório " + String(i+1).padStart(2,'0'),
        doctor: "",
        patients: []
      }))
    };

    controladorInput.value = "";
    dataInput.value = state.data;
    document.querySelectorAll('input[name="periodo"]').forEach(r => r.checked = false);

    renderRooms();
    renderPivot();
    queueSave();
  });

  function countRoom(room){
    const counts = {Azul:0, Verde:0, Amarelo:0, Laranja:0};
    room.patients.forEach(p => { if(p.risk && counts.hasOwnProperty(p.risk)) counts[p.risk]++; });
    return counts;
  }

  function riskMiniOptions(roomIdx, patientId, current){
    return RISKS.map(r => `
      <label class="risk-mini" data-r="${r}" title="${r}">
        <input type="radio" name="risk-${roomIdx}-${patientId}" value="${r}" ${current===r?'checked':''}
          onchange="window.__setRisk(${roomIdx}, ${patientId}, '${r}')">
        <span></span>
      </label>
    `).join('');
  }

  function renderRoomCard(room, roomIdx){
    const rows = room.patients.map((p, i) => `
      <tr>
        <td class="idx">${i+1}</td>
        <td>
          <input type="text" class="patient-input" placeholder="Nome do paciente" value="${escapeAttr(p.name)}"
            oninput="window.__setPatientName(${roomIdx}, ${p.id}, this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault(); window.__addPatient(${roomIdx});}">
        </td>
        <td><div class="risk-mini-options">${riskMiniOptions(roomIdx, p.id, p.risk)}</div><span class="risk-print-label">${p.risk ? escapeHtml(p.risk.toUpperCase()) : ''}</span></td>
        <td><button class="del-row-btn" title="Remover" onclick="window.__removePatient(${roomIdx}, ${p.id})">×</button></td>
      </tr>
    `).join('');

    const counts = countRoom(room);
    const total = counts.Azul + counts.Verde + counts.Amarelo + counts.Laranja;

    const tableOrEmpty = room.patients.length ? `
      <table class="grid-table">
        <thead>
          <tr>
            <th class="num-col">#</th>
            <th>Paciente</th>
            <th class="risk-col">Classificação</th>
            <th class="del-col"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    ` : `<div class="room-empty">Nenhum paciente adicionado ainda.</div>`;

    return `
      <div class="room-card">
        <div class="room-head">
          <h2>${escapeHtml(room.name)}</h2>
          <div class="doctor-field">
            <label>Médico</label>
            <input type="text" list="doctorList" placeholder="Nome do médico" value="${escapeAttr(room.doctor)}"
              oninput="window.__setDoctor(${roomIdx}, this.value)">
          </div>
        </div>
        <div class="room-body">
          ${tableOrEmpty}
          <button class="add-patient-btn" onclick="window.__addPatient(${roomIdx})">+ Adicionar paciente</button>
          <div class="room-foot">
            <span class="mini-total Azul"><span class="dot"></span>Azul ${counts.Azul}</span>
            <span class="mini-total Verde"><span class="dot"></span>Verde ${counts.Verde}</span>
            <span class="mini-total Amarelo"><span class="dot"></span>Amarelo ${counts.Amarelo}</span>
            <span class="mini-total Laranja"><span class="dot"></span>Laranja ${counts.Laranja}</span>
            <span class="mini-total geral">Total ${total}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderRooms(){
    roomsGrid.innerHTML = state.rooms.map((room, idx) => renderRoomCard(room, idx)).join('');
  }

  function renderPivot(){
    const colTotals = {Azul:0, Verde:0, Amarelo:0, Laranja:0};
    let grandTotal = 0;

    const bodyRows = state.rooms.map(room => {
      const counts = countRoom(room);
      const rowTotal = RISKS.reduce((s,r) => s + counts[r], 0);
      grandTotal += rowTotal;
      RISKS.forEach(r => { colTotals[r] += counts[r]; });
      const doctorLine = room.doctor ? `<span class="doctor-sub">${escapeHtml(room.doctor)}</span>` : '';
      return `
        <tr>
          <td class="room-name">${escapeHtml(room.name)}${doctorLine}</td>
          <td class="num">${counts.Azul}</td>
          <td class="num">${counts.Verde}</td>
          <td class="num">${counts.Amarelo}</td>
          <td class="num">${counts.Laranja}</td>
          <td class="total-col">${rowTotal}</td>
        </tr>
      `;
    }).join('');

    pivotHost.innerHTML = `
      <table class="pivot">
        <thead>
          <tr>
            <th>Consultório</th>
            <th class="risk-col-Azul">Azul</th>
            <th class="risk-col-Verde">Verde</th>
            <th class="risk-col-Amarelo">Amarelo</th>
            <th class="risk-col-Laranja">Laranja</th>
            <th class="total-col">Total</th>
          </tr>
        </thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>
          <tr>
            <td>Total por classificação</td>
            <td class="num">${colTotals.Azul}</td>
            <td class="num">${colTotals.Verde}</td>
            <td class="num">${colTotals.Amarelo}</td>
            <td class="num">${colTotals.Laranja}</td>
            <td class="total-col">${grandTotal}</td>
          </tr>
        </tfoot>
      </table>
    `;
  }

  function rerender(){
    renderRooms();
    renderPivot();
    queueSave();
  }

  window.__setDoctor = function(roomIdx, value){
    state.rooms[roomIdx].doctor = value;
    // don't full re-render the input the user is typing in; just update pivot + queue save
    renderPivot();
    queueSave();
  };

  window.__addPatient = function(roomIdx){
    const room = state.rooms[roomIdx];
    const nextId = (room.patients.reduce((m,p) => Math.max(m,p.id), 0)) + 1;
    room.patients.push({id: nextId, name: "", risk: null});
    rerender();
    // focus the new patient name input
    requestAnimationFrame(() => {
      const cards = document.querySelectorAll('.room-card');
      const card = cards[roomIdx];
      if(card){
        const inputs = card.querySelectorAll('.patient-input');
        const last = inputs[inputs.length - 1];
        if(last) last.focus();
      }
    });
  };

  window.__removePatient = function(roomIdx, patientId){
    const room = state.rooms[roomIdx];
    room.patients = room.patients.filter(p => p.id !== patientId);
    rerender();
  };

  window.__setPatientName = function(roomIdx, patientId, value){
    const p = state.rooms[roomIdx].patients.find(p => p.id === patientId);
    if(p) p.name = value;
    queueSave();
  };

  window.__setRisk = function(roomIdx, patientId, risk){
    const p = state.rooms[roomIdx].patients.find(p => p.id === patientId);
    if(p) p.risk = risk;
    renderRooms();
    renderPivot();
    queueSave();
  };

  const versionTagEl = document.getElementById('versionTag');
  if(versionTagEl) versionTagEl.textContent = "· v" + APP_VERSION;

  loadState();
})();
</script>
</body>
</html>
